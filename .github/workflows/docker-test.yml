name: Docker smoke test

on:
  push:
  pull_request:

jobs:
  docker-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for /health (up to 60s)
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || true)
            if [ "$code" = "200" ]; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for /health"
          exit 1

      - name: Check homepage returns 200
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/)
          echo "GET / -> $code"
          [ "$code" = "200" ]

      - name: Print logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down
